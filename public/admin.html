<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Webhook Protector — admin</title>
<style>
  body { font-family: ui-monospace, monospace; background:#0b0d10; color:#d6dde6; padding:24px; }
  input, button { font: inherit; padding:8px; background:#141920; color:#d6dde6; border:1px solid #2a333d; border-radius:6px; }
  button { cursor:pointer; }
  .row { margin:8px 0; }
  pre { background:#0f1419; padding:12px; border-radius:6px; overflow:auto; max-height:320px; }
  .danger { color:#ff6b6b; }
</style>
</head>
<body>
<h2>Webhook Protector</h2>
<div class="row"><input id="tok" placeholder="admin token" size="48"><button onclick="saveTok()">save</button></div>

<h3>Status</h3>
<button onclick="health()">check webhook health</button>
<button onclick="testWebhook()">send test message</button>
<button onclick="stats()">refresh stats</button>
<pre id="out">idle</pre>

<h3>API keys</h3>
<button onclick="newKey()">create key</button>
<button onclick="listKeys()">list keys</button>
<pre id="keys"></pre>

<h3>Rotate webhook</h3>
<div class="row"><input id="wh" placeholder="https://discord.com/api/webhooks/..." size="64"><button onclick="rotate()">rotate</button></div>

<h3 class="danger">Kill switch</h3>
<button onclick="kill(true)">disable forwarding</button>
<button onclick="kill(false)">enable forwarding</button>

<script>
const tok = () => localStorage.getItem('admin_token') || '';
function saveTok(){ localStorage.setItem('admin_token', document.getElementById('tok').value); }
async function api(path, opts={}) {
  opts.headers = Object.assign({'x-admin-token': tok(), 'Content-Type':'application/json'}, opts.headers||{});
  const r = await fetch(path, opts);
  return r.json();
}
async function health(){ document.getElementById('out').textContent = JSON.stringify(await api('/api/health'), null, 2); }
async function testWebhook(){ document.getElementById('out').textContent = JSON.stringify(await api('/admin/test-webhook', {method:'POST'}), null, 2); }
async function stats(){ document.getElementById('out').textContent = JSON.stringify(await api('/admin/stats'), null, 2); }
async function newKey(){ const r = await api('/admin/keys', {method:'POST', body: JSON.stringify({label:'key'})}); document.getElementById('keys').textContent = JSON.stringify(r, null, 2); }
async function listKeys(){ document.getElementById('keys').textContent = JSON.stringify(await api('/admin/keys'), null, 2); }
async function rotate(){ const r = await api('/admin/rotate', {method:'POST', body: JSON.stringify({webhook: document.getElementById('wh').value})}); document.getElementById('out').textContent = JSON.stringify(r, null, 2); }
async function kill(on){ const r = await api('/admin/kill', {method:'POST', body: JSON.stringify({on})}); document.getElementById('out').textContent = JSON.stringify(r, null, 2); }
</script>
</body>
</html>
